  # === 139. MinIO OIDC Policy scope mapping ================================
  139-sso-minio-policy-mapping.yaml: |
    version: 1
    metadata:
      name: SSO - MinIO OIDC Policy scope mapping v2
    entries:
      - model: authentik_providers_oauth2.scopemapping
        identifiers:
          name: minio-policy-mapping
        attrs:
          name: "MinIO Policy Scope"
          scope_name: openid
          description: "Map user groups or roles to MinIO policy claim"
          expression: |
            policies = []
            if any(g.name == 'authentik Admins' for g in request.user.ak_groups.all()):
                policies.append('consoleAdmin')
            else:
                policies.append('readwrite')
            return {
                "policy": policies
            }

