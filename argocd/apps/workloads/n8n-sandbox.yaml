apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: n8n-sandbox
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: workloads
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: n8n
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
  sources:
    - repoURL: 'https://github.com/n8n-io/n8n-sandbox-service.git'
      targetRevision: service/v1.3.2
      path: charts/n8n-sandbox-service
      helm:
        valuesObject:
          fullnameOverride: sandbox

          dataPlane:
            mode: in-cluster

          auth:
            existingSecret: n8n-secrets
            secretKeys:
              apiKeys: N8N_SANDBOX_API_KEY
              runnerRegistrationToken: SANDBOX_REGISTRATION_TOKEN
              runnerApiKey: SANDBOX_RUNNER_API_KEY
              runnerApiKeys: SANDBOX_RUNNER_API_KEY

          runner:
            isolation: privileged
            acknowledgePrivileged: true
            replicaCount: 1
            dockerDataRoot:
              persistence:
                enabled: false
              emptyDir:
                sizeLimit: 40Gi
            config:
              defaultDiskQuotaMb: "0"
            extraEnv:
              - name: HTTP_PROXY
                value: "http://192.168.50.79:6152"
              - name: HTTPS_PROXY
                value: "http://192.168.50.79:6152"
              - name: http_proxy
                value: "http://192.168.50.79:6152"
              - name: https_proxy
                value: "http://192.168.50.79:6152"
              - name: NO_PROXY
                value: "sandbox-api,sandbox-privileged-runner,127.0.0.1,localhost,.svc,.cluster.local,10.96.0.0/12,10.244.0.0/16,192.168.50.0/24"
              - name: no_proxy
                value: "sandbox-api,sandbox-privileged-runner,127.0.0.1,localhost,.svc,.cluster.local,10.96.0.0/12,10.244.0.0/16,192.168.50.0/24"

          api:
            replicaCount: 1
            persistence:
              enabled: true
              storageClass: longhorn
              size: 2Gi
              accessModes:
                - ReadWriteOnce

          tls:
            mode: certManager
            certManager:
              issuerRef:
                name: n8n-sandbox-ca-issuer
                kind: ClusterIssuer
                group: cert-manager.io
