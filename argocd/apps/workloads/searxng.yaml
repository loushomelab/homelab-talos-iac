apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: searxng
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    link.argocd.argoproj.io/external-link: https://searxng.646499453.xyz:8443
spec:
  project: workloads
  source:
    repoURL: 'https://github.com/loushomelab/homelab-talos-iac.git'
    targetRevision: main
    path: argocd/configs/workloads/searxng/manifests
    directory:
      recurse: true
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: n8n
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
