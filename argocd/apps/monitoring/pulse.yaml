apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pulse
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: monitoring
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
  sources:
  - repoURL: 'https://rcourtman.github.io/Pulse'
    chart: pulse
    targetRevision: 6.2.1
    helm:
      valuesObject:
        strategy:
          type: Recreate
        persistence:
          enabled: true
          existingClaim: pulse-pvc
        server:
          env:
            - name: TZ
              value: Asia/Shanghai
            - name: FRONTEND_PORT
              value: "7655"
            - name: PULSE_AGENT_INGEST_PORT
              value: "7656"
            - name: PULSE_PUBLIC_URL
              value: https://pulse.646499453.xyz:8443
            - name: PULSE_AGENT_CONNECT_URL
              value: https://pulse-ingest.646499453.xyz:8443
            - name: PULSE_AUTH_USER
              valueFrom:
                secretKeyRef:
                  name: monitoring-secrets
                  key: PULSE_AUTH_USER
            - name: PULSE_AUTH_PASS
              valueFrom:
                secretKeyRef:
                  name: monitoring-secrets
                  key: PULSE_AUTH_PASS
            - name: PULSE_AUTH_HIDE_LOCAL_LOGIN
              value: "true"
            - name: OIDC_ENABLED
              value: "true"
            - name: OIDC_ISSUER_URL
              value: https://authentik.646499453.xyz:8443/application/o/pulse/
            - name: OIDC_CLIENT_ID
              value: pulse
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: monitoring-secrets
                  key: AUTHENTIK_OIDC_PULSE_SECRET
            - name: OIDC_SCOPES
              value: "openid profile email groups"
            - name: OIDC_GROUPS_CLAIM
              value: "groups"
            - name: OIDC_GROUP_ROLE_MAPPINGS
              value: "authentik Admins=admin,authentik-admins=admin,Admins=admin"
            - name: PULSE_INIT_CONFIG_DATA
              valueFrom:
                secretKeyRef:
                  name: monitoring-secrets
                  key: PULSE_INIT_CONFIG_DATA
                  optional: true
            - name: PULSE_INIT_CONFIG_PASSPHRASE
              valueFrom:
                secretKeyRef:
                  name: monitoring-secrets
                  key: PULSE_INIT_CONFIG_PASSPHRASE
                  optional: true
        ingress:
          enabled: true
          className: traefik
          hosts:
          - host: pulse.646499453.xyz
            paths:
            - path: /
              pathType: Prefix
          tls:
          - secretName: wildcards-646499453-xyz-tls
            hosts:
            - pulse.646499453.xyz
          annotations:
            traefik.ingress.kubernetes.io/router.middlewares: monitoring-lan-only-allowlist@kubernetescrd
            gethomepage.dev/enabled: "true"
            gethomepage.dev/name: "Pulse"
            gethomepage.dev/description: "Infrastructure Monitoring Workspace"
            gethomepage.dev/group: "Dashboards"
            gethomepage.dev/icon: "sh-pulse.svg"
            gethomepage.dev/href: "https://pulse.646499453.xyz:8443"
            gethomepage.dev/pod-selector: "app.kubernetes.io/name=pulse"
            gethomepage.dev/widget.type: "pulse"
            gethomepage.dev/widget.url: "http://pulse.monitoring.svc.cluster.local:7655"
            gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_PULSE_API_KEY}}"
