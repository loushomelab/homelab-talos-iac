apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: monitoring
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
  sources:
  - repoURL: 'https://grafana.github.io/helm-charts'
    chart: grafana
    targetRevision: 10.5.15
    helm:
      valuesObject:
        envFromSecret: monitoring-secrets
        adminUser: admin
        env:
          GF_SERVER_ROOT_URL: https://grafana.646499453.xyz:8443/
          GF_AUTH_DISABLE_LOGIN_FORM: "true"
          GF_AUTH_OAUTH_AUTO_LOGIN: "false"
          GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
          GF_AUTH_GENERIC_OAUTH_NAME: "Authentik"
          GF_AUTH_GENERIC_OAUTH_ICON: "signin"
          GF_AUTH_GENERIC_OAUTH_CLIENT_ID: "grafana"
          # Use raw environment variable reference that external-secrets will populate
          GF_AUTH_GENERIC_OAUTH_SCOPES: "openid email profile grafana_groups"
          GF_AUTH_GENERIC_OAUTH_AUTH_URL: "https://authentik.646499453.xyz:8443/application/o/authorize/"
          GF_AUTH_GENERIC_OAUTH_TOKEN_URL: "https://authentik.646499453.xyz:8443/application/o/token/"
          GF_AUTH_GENERIC_OAUTH_API_URL: "https://authentik.646499453.xyz:8443/application/o/userinfo/"
          GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(groups[*], 'authentik Admins') && 'Admin' || contains(groups[*], 'Grafana Admins') && 'Admin' || contains(groups[*], 'Grafana Editors') && 'Editor' || 'Viewer'"
          GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN: "true"
        grafana.ini:

          database:
            type: postgres
            host: $__env{DB_OBS_POSTGRESQL__HOST}:5432
            name: $__env{GRAFANA_DB_NAME}
            user: $__env{GRAFANA_DB_USER}
            password: $__env{GRAFANA_DB_PASSWORD}
            ssl_mode: disable
        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
            - name: Mimir (Prometheus)
              type: prometheus
              access: proxy
              url: http://mimir-distributed-gateway.monitoring.svc.cluster.local
              isDefault: true
              jsonData:
                httpMethod: POST
                timeInterval: 15s
            - name: Pyroscope
              type: grafana-pyroscope-datasource
              access: proxy
              url: http://pyroscope.monitoring.svc:4040
              jsonData:
                minStep: 15s
        ingress:
          enabled: true
          ingressClassName: traefik
          hosts:
          - grafana.646499453.xyz
          paths:
          - /
          pathType: Prefix
          tls:
          - secretName: wildcards-646499453-xyz-tls
            hosts:
            - grafana.646499453.xyz
          annotations:
            gethomepage.dev/enabled: "true"
            gethomepage.dev/name: "Grafana"
            gethomepage.dev/description: "Data Visualization & Monitoring"
            gethomepage.dev/group: "Dashboards"
            gethomepage.dev/icon: "sh-grafana.svg"
            gethomepage.dev/href: "https://grafana.646499453.xyz:8443"
            gethomepage.dev/widget.type: "grafana"
            gethomepage.dev/widget.url: "http://grafana.monitoring.svc.cluster.local:80"
            gethomepage.dev/widget.key: "{{ \"{{HOMEPAGE_VAR_GRAFANA_TOKEN}}\" }}"
