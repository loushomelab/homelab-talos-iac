apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: monitoring
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
  sources:
  - repoURL: 'ghcr.io/grafana/helm-charts'
    chart: grafana
    targetRevision: 10.5.15
    helm:
      valuesObject:
        envFromSecret: monitoring-secrets
        env:
          TZ: Asia/Shanghai
        plugins:
          - grafana-clock-panel
          - grafana-piechart-panel
        initChownData:
          enabled: true
        admin:
          existingSecret: grafana-admin-credentials
          userKey: admin-user
          passwordKey: admin-password

        extraObjects:
          - apiVersion: external-secrets.io/v1
            kind: ExternalSecret
            metadata:
              name: grafana-oauth-secret
              namespace: monitoring
            spec:
              refreshInterval: 1m
              secretStoreRef:
                kind: ClusterSecretStore
                name: doppler-cluster-store
              target:
                name: grafana-oauth-secret
                creationPolicy: Owner
              data:
                - secretKey: client_secret
                  remoteRef:
                    key: AUTHENTIK_OIDC_GRAFANA_SECRET

        extraSecretMounts:
          - name: auth-secret
            mountPath: /etc/secrets/auth
            secretName: grafana-oauth-secret
            readOnly: true
        grafana.ini:
          plugins:
            allow_loading_unsigned_plugins: grafana-piechart-panel
          date_formats:
            default_timezone: Asia/Shanghai
          server:
            root_url: https://grafana.646499453.xyz:8443/
          auth:
            disable_login_form: true
            oauth_auto_login: false
          auth.basic:
            enabled: true
          auth.generic_oauth:
            enabled: true
            name: Authentik
            icon: signin
            client_id: grafana
            client_secret: $__file{/etc/secrets/auth/client_secret}
            scopes: openid email profile grafana_groups
            auth_url: https://authentik.646499453.xyz:8443/application/o/authorize/
            token_url: https://authentik.646499453.xyz:8443/application/o/token/
            api_url: https://authentik.646499453.xyz:8443/application/o/userinfo/
            role_attribute_path: contains(groups[*], 'authentik Admins') && 'Admin' || contains(groups[*], 'Grafana Admins') && 'Admin' || contains(groups[*], 'Grafana Editors') && 'Editor' || 'Viewer'
            allow_assign_grafana_admin: true
          database:
            type: postgres
            host: $__env{DB_OBS_POSTGRESQL__HOST}:5432
            name: $__env{GRAFANA_DB_NAME}
            user: $__env{GRAFANA_DB_USER}
            password: $__env{GRAFANA_DB_PASSWORD}
            ssl_mode: disable
        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
            - name: Mimir (Prometheus)
              type: prometheus
              access: proxy
              url: http://mimir-gateway.monitoring.svc.cluster.local/prometheus
              isDefault: true
              jsonData:
                httpMethod: POST
                timeInterval: 15s
            - name: Pyroscope
              type: grafana-pyroscope-datasource
              access: proxy
              url: http://pyroscope.monitoring.svc:4040
              jsonData:
                minStep: 15s
            - name: Alertmanager
              type: alertmanager
              access: proxy
              url: http://alertmanager.monitoring.svc.cluster.local:9093
              jsonData:
                implementation: prometheus
        ingress:
          enabled: true
          ingressClassName: traefik
          hosts:
          - grafana.646499453.xyz
          paths:
          - /
          pathType: Prefix
          tls:
          - secretName: wildcards-646499453-xyz-tls
            hosts:
            - grafana.646499453.xyz
          annotations:
            gethomepage.dev/enabled: "true"
            gethomepage.dev/name: "Grafana"
            gethomepage.dev/description: "Data Visualization & Monitoring"
            gethomepage.dev/group: "Dashboards"
            gethomepage.dev/icon: "sh-grafana.svg"
            gethomepage.dev/href: "https://grafana.646499453.xyz:8443"
            gethomepage.dev/pod-selector: "app.kubernetes.io/name=grafana"
            gethomepage.dev/widget.type: "grafana"
            gethomepage.dev/widget.version: "2"
            gethomepage.dev/widget.alert: "alertmanager"
            gethomepage.dev/widget.url: "http://grafana.monitoring.svc.cluster.local:80"
            gethomepage.dev/widget.username: "{{ \"{{HOMEPAGE_VAR_GRAFANA_USERNAME}}\" }}"
            gethomepage.dev/widget.password: "{{ \"{{HOMEPAGE_VAR_GRAFANA_PASSWORD}}\" }}"
