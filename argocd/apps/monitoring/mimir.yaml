apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mimir
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
  sources:
  - repoURL: https://grafana.github.io/helm-charts
    chart: mimir-distributed
    targetRevision: 6.1.0
    helm:
      valuesObject:
        global:
          extraEnvFrom:
          - secretRef:
              name: monitoring-secrets
        mimir:
          structuredConfig:
            multitenancy_enabled: false
            usage_stats:
              enabled: false
            ingest_storage:
              enabled: false
            ingester:
              push_grpc_method_enabled: true
              ring:
                replication_factor: 1
            common:
              storage:
                backend: s3
                s3:
                  endpoint: ${S3_ENDPOINT}
                  access_key_id: ${S3_MIMIR_ACCESS_KEY}
                  secret_access_key: ${S3_MIMIR_SECRET_KEY}
                  bucket_name: s3-mimir
                  insecure: true
            blocks_storage:
              backend: s3
              s3:
                endpoint: ${S3_ENDPOINT}
                access_key_id: ${S3_MIMIR_ACCESS_KEY}
                secret_access_key: ${S3_MIMIR_SECRET_KEY}
                bucket_name: s3-mimir
                insecure: true
              tsdb:
                dir: /data/tsdb
            limits:
              max_global_series_per_user: 5000000
        distributor:
          replicas: 1
        ingester:
          replicas: 1
          persistentVolume:
            enabled: false
          zones: []
        querier:
          replicas: 1
        query_frontend:
          replicas: 1
        store_gateway:
          replicas: 1
          persistentVolume:
            enabled: false
          zones: []
        compactor:
          replicas: 1
          persistentVolume:
            enabled: false
        ruler:
          enabled: false
        alertmanager:
          enabled: false
        gateway:
          enabled: true
          replicas: 1
          ingress:
            enabled: true
            ingressClassName: traefik
            hosts:
            - host: mimir.646499453.xyz
              paths:
              - path: /
                pathType: Prefix
            tls:
            - secretName: wildcards-646499453-xyz-tls
              hosts:
              - mimir.646499453.xyz
            annotations:
              gethomepage.dev/enabled: "true"
              gethomepage.dev/name: "Mimir"
              gethomepage.dev/description: "Scalable Long-term Metrics"
              gethomepage.dev/group: "Monitoring"
              gethomepage.dev/icon: "sh-grafana-mimir.svg"
              gethomepage.dev/href: "https://mimir.646499453.xyz:8443"
              traefik.ingress.kubernetes.io/router.middlewares: 
                monitoring-lan-only-allowlist@kubernetescrd
        minio:
          enabled: false
        kafka:
          enabled: false
