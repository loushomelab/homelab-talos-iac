apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pyroscope
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: monitoring
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
  sources:
  - repoURL: 'https://grafana.github.io/helm-charts'
    chart: pyroscope
    targetRevision: 2.2.0
    helm:
      valuesObject:
        pyroscope:
          extraEnvFrom:
          - secretRef:
              name: monitoring-secrets
          extraArgs:
            storage.s3.endpoint: $(S3_ENDPOINT)
            storage.s3.access-key-id: $(S3_PYROSCOPE_ACCESS_KEY)
            storage.s3.secret-access-key: $(S3_PYROSCOPE_SECRET_KEY)
          structuredConfig:
            multitenancy_enabled: false
            storage:
              backend: s3
              s3:
                bucket_name: s3-pyroscope
                insecure: true
        minio:
          enabled: false
        replicaCount: 1
        ingress:
          enabled: true
          className: traefik
          hosts:
          - pyroscope.646499453.xyz
          tls:
          - secretName: wildcards-646499453-xyz-tls
            hosts:
            - pyroscope.646499453.xyz
          annotations:
            gethomepage.dev/enabled: "true"
            gethomepage.dev/name: "Pyroscope"
            gethomepage.dev/description: "Continuous Profiling"
            gethomepage.dev/group: "Monitoring"
            gethomepage.dev/icon: "https://grafana.com/static/img/pyroscope-logo.svg"
            gethomepage.dev/href: "https://pyroscope.646499453.xyz:8443"
            traefik.ingress.kubernetes.io/router.middlewares: 
              monitoring-lan-only-allowlist@kubernetescrd
