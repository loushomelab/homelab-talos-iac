apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: monitoring
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
  sources:
  - repoURL: 'https://grafana.github.io/helm-charts'
    chart: alloy
    targetRevision: 1.12.1
    helm:
      valuesObject:
        # Grafana Alloy Helm Chart Values
        # Configured as a DaemonSet with eBPF continuous profiling and Prometheus CRD scraping
        # Docs: https://grafana.com/docs/alloy/latest/
        controller:
          type: daemonset
          # Required for eBPF profiling to map host PIDs to containers
          hostPID: true

        alloy:
          extraEnv:
          - name: TZ
            value: Asia/Shanghai
          envFrom:
          - secretRef:
              name: monitoring-secrets

          # Run with high privileges required for eBPF Kernel probing
          securityContext:
            privileged: true

          configMap:
            create: true
            content: |
              // --------------------------------------------------------------------------
              // 📊 METRICS COLLECTION (Prometheus Operator CRDs)
              // --------------------------------------------------------------------------

              // Dynamically discover and scrape targets from ServiceMonitor CRDs
              prometheus.operator.servicemonitors "default" {
                forward_to = [prometheus.remote_write.mimir.receiver]
              }

              // Dynamically discover and scrape targets from PodMonitor CRDs
              prometheus.operator.podmonitors "default" {
                forward_to = [prometheus.remote_write.mimir.receiver]
              }

              // Remote write all collected metrics to Mimir gateway (no authentication required as multitenancy is disabled)
              prometheus.remote_write "mimir" {
                endpoint {
                  url = "http://mimir-gateway.monitoring.svc.cluster.local/api/v1/push"
                }
              }

              // --------------------------------------------------------------------------
              // 🔬 CONTINUOUS PROFILING (eBPF & Pyroscope)
              // --------------------------------------------------------------------------

              // Discover all Kubernetes pods running on the current node
              discovery.kubernetes "local_pods" {
                role = "pod"
                selectors {
                  field = "spec.nodeName=" + sys.env("HOSTNAME")
                }
              }

              // Inject metadata labels (namespace, pod name, container name) into profiles
              discovery.relabel "ebpf_targets" {
                targets = discovery.kubernetes.local_pods.targets
                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  target_label  = "namespace"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  target_label  = "pod"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_container_name"]
                  target_label  = "container"
                }
                // Set service_name based on pod name or standard labels
                rule {
                  source_labels = ["__meta_kubernetes_pod_label_app"]
                  target_label  = "service_name"
                }
              }

              // Probe the Linux kernel via eBPF on every node to profile active container processes
              pyroscope.ebpf "local_pods" {
                forward_to       = [pyroscope.write.pyroscope.receiver]
                targets          = discovery.relabel.ebpf_targets.output
                sample_rate      = 97 # Samples per second
                collect_interval = "15s"
              }

              // Push profiles to Pyroscope distributor endpoint
              pyroscope.write "pyroscope" {
                endpoint {
                  url = "http://pyroscope.monitoring.svc.cluster.local:4040"
                }
              }
