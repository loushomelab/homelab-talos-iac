apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale-secrets
  namespace: argocd
  annotations:
    # infra-tier-2 wave 0, same phase as the other services in this directory.
    # ExternalSecret must be Healthy (Secret/operator-oauth exists) before
    # tailscale-operator (wave 1) is applied. ClusterSecretStore
    # doppler-cluster-store is already up from security-tier-1 (global wave 10).
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra
  source:
    repoURL: 'https://github.com/loushomelab/homelab-talos-iac.git'
    targetRevision: HEAD
    path: argocd/configs/infrastructure/tailscale/secrets
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: tailscale
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
