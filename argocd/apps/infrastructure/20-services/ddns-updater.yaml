apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ddns-updater
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  project: infra
  sources:
    - repoURL: 'https://repo.helmforge.dev'
      chart: ddns-updater
      targetRevision: "2.10.0"
      helm:
        valueFiles:
          - $values/configs/infrastructure/ddns-updater/values.yaml
    - repoURL: 'https://github.com/loushomelab/homelab-talos-iac.git'
      targetRevision: HEAD
      ref: values
    - repoURL: 'https://github.com/loushomelab/homelab-talos-iac.git'
      path: argocd/configs/infrastructure/ddns-updater/manifests
      targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: ddns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
