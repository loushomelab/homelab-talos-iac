apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  annotations:
    link.argocd.argoproj.io/external-link: https://traefik.646499453.xyz:8443
spec:
  project: infra
  sources:
  - repoURL: 'ghcr.io/traefik/helm'
    chart: traefik
    targetRevision: 41.3.0
    helm:
      valuesObject:
        env:
          - name: TZ
            value: Asia/Shanghai
        deployment:
  # -- Enable deployment
          enabled: true
  # -- Deployment or DaemonSet
          kind: DaemonSet


# @schema mergeProperties: true
        ports:
          web:
            http:
              redirections:
                entryPoint:
                  to: websecure
                  scheme: https
          websecure:
            port: 8443
            exposedPort: 8443
            http:
              tls:
                enabled: true
          # Expose the internal "traefik" entrypoint (API) on the Service so
          # in-cluster consumers (homepage traefik widget) can reach
          # http://traefik.traefik.svc.cluster.local:8080/api/overview.
          # expose.default:false keeps it off the LoadBalancer IP (per chart
          # schema, expose is an object, not a boolean).
          traefik:
            port: 8080
            expose:
              default: false
            exposedPort: 8080

# 强制 Traefik 使用 MetalLB 池子里的第一个 IP，方便你在 Surge 里做 DNS 映射
        service:
          type: LoadBalancer
          spec:
            loadBalancerIP: 192.168.50.230

        providers:
          kubernetesCRD:
            enabled: true
            allowCrossNamespace: true
            allowExternalNameServices: true
          kubernetesIngress:
            enabled: true
            allowExternalNameServices: true
        # Expose the Traefik API on the internal "traefik" entrypoint (port 8080)
        # so the homepage traefik widget can query /api/overview, routers,
        # services, and middleware from inside the cluster without going
        # through the auth-protected dashboard on 8443.
        api:
          dashboard: true
          insecure: true
        ingressRoute:
          dashboard:
            enabled: true
            annotations:
              gethomepage.dev/enabled: "true"
              gethomepage.dev/name: "Traefik"
              gethomepage.dev/description: "Ingress Controller"
              gethomepage.dev/group: "Infrastructure"
              gethomepage.dev/icon: "sh-traefik.svg"
              gethomepage.dev/href: "https://traefik.646499453.xyz:8443"
              gethomepage.dev/pod-selector: "app.kubernetes.io/name=traefik"
              # Traefik service widget: pulls routers/services/middleware from
              # the Traefik API on port 8080. Uses the dedicated
              # `traefik-api` ClusterIP service (see extraObjects) since the
              # chart-generated `traefik` Service only exposes the web/websecure
              # entrypoints and would refuse this connection.
              gethomepage.dev/widget.type: "traefik"
              gethomepage.dev/widget.url: "http://traefik-api.traefik.svc.cluster.local:8080"
            matchRule: Host(`traefik.646499453.xyz`)
            entryPoints: ["websecure"]
            middlewares:
            - name: authentik-forwardauth
            tls:
              secretName: wildcards-646499453-xyz-tls

        extraObjects:
        - apiVersion: traefik.io/v1alpha1
          kind: Middleware
          metadata:
            name: authentik-forwardauth
            namespace: traefik
          spec:
            forwardAuth:
              address: "http://authentik-server.authentik.svc.cluster.local:80/outpost.goauthentik.io/auth/traefik"
              trustForwardHeader: true
              maxResponseBodySize: 2097152
              authResponseHeaders:
              - X-authentik-username
              - X-authentik-groups
              - X-authentik-email
              - X-authentik-name
              - X-authentik-uid
              - X-authentik-jwt
              - X-authentik-meta-jwks
              - X-authentik-meta-outpost
              - X-authentik-meta-provider
              - X-authentik-meta-app
              - X-authentik-meta-version
        # Cluster-internal Service exposing the Traefik API on 8080 so the
        # homepage traefik widget can call /api/overview etc. without going
        # through the auth-protected dashboard on 8443. The Traefik chart's
        # auto-generated Service only includes ports whose expose.default
        # is true (which would also publish them on the LoadBalancer IP),
        # so we expose 8080 via this ClusterIP-only Service instead.
        - apiVersion: v1
          kind: Service
          metadata:
            name: traefik-api
            namespace: traefik
            labels:
              app.kubernetes.io/name: traefik
              app.kubernetes.io/component: api
          spec:
            type: ClusterIP
            selector:
              app.kubernetes.io/name: traefik
            ports:
            - name: traefik
              port: 8080
              targetPort: 8080
              protocol: TCP
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
