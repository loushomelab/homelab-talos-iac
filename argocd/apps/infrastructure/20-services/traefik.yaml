apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  annotations:
    link.argocd.argoproj.io/external-link: https://traefik.646499453.xyz:8443
spec:
  project: infra
  sources:
  - repoURL: 'https://helm.traefik.io/traefik'
    chart: traefik
    targetRevision: 41.2.0
    helm:
      valuesObject:
        deployment:
  # -- Enable deployment
          enabled: true
  # -- Deployment or DaemonSet
          kind: DaemonSet


# @schema mergeProperties: true
        ports:
          web:
            http:
              redirections:
                entryPoint:
                  to: websecure
                  scheme: https
          websecure:
            port: 8443
            exposedPort: 8443
            http:
              tls:
                enabled: true

# 强制 Traefik 使用 MetalLB 池子里的第一个 IP，方便你在 Surge 里做 DNS 映射
        service:
          type: LoadBalancer
          spec:
            loadBalancerIP: 192.168.50.230

        providers:
          kubernetesCRD:
            enabled: true
            allowCrossNamespace: true
            allowExternalNameServices: true
          kubernetesIngress:
            enabled: true
            allowExternalNameServices: true
        ingressRoute:
          dashboard:
            enabled: true
            matchRule: Host(`traefik.646499453.xyz`)
            entryPoints: ["websecure"]
            middlewares:
            - name: authentik-forwardauth
            tls:
              secretName: wildcards-646499453-xyz-tls

        extraObjects:
        - apiVersion: traefik.io/v1alpha1
          kind: Middleware
          metadata:
            name: authentik-forwardauth
            namespace: traefik
          spec:
            forwardAuth:
              address: "http://authentik-server.authentik.svc.cluster.local:80/outpost.goauthentik.io/auth/traefik"
              trustForwardHeader: true
              maxResponseBodySize: 2097152
              authResponseHeaders:
              - X-authentik-username
              - X-authentik-groups
              - X-authentik-email
              - X-authentik-name
              - X-authentik-uid
              - X-authentik-jwt
              - X-authentik-meta-jwks
              - X-authentik-meta-outpost
              - X-authentik-meta-provider
              - X-authentik-meta-app
              - X-authentik-meta-version
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
