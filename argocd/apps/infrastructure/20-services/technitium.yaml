apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: technitium
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    link.argocd.argoproj.io/external-link: https://technitium.646499453.xyz:8443
spec:
  project: infra
  source:
    repoURL: 'https://github.com/loushomelab/homelab-talos-iac.git'
    targetRevision: HEAD
    path: argocd/configs/infrastructure/technitium/manifests
    directory:
      recurse: true
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: technitium
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
