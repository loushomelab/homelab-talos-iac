apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  annotations:
spec:
  project: infra
  sources:
  - repoURL: 'https://metallb.github.io/metallb'
    chart: metallb
    targetRevision: 0.16.1
    helm:
      valuesObject:
# MetalLB Controller & Speaker values
# 大部分保持默认即可，MetalLB 的核心配置通过后续应用 CRD 来完成
        controller:
          tolerations:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
            effect: NoSchedule

        speaker:
          tolerations:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
            effect: NoSchedule
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: metallb-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
