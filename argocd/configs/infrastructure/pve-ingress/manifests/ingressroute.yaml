apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: pve-transport
  namespace: traefik
spec:
  insecureSkipVerify: true
---
# ==========================================
# r720 Node
# ==========================================
apiVersion: v1
kind: Service
metadata:
  name: pve-r720
  namespace: traefik
spec:
  type: ExternalName
  externalName: 192.168.50.101
  ports:
    - name: https
      port: 8006
      targetPort: 8006
      protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pve-r720
  namespace: traefik
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "r720"
    gethomepage.dev/group: "PVE"
    gethomepage.dev/icon: "proxmox.png"
    gethomepage.dev/href: "https://r720.pve.646499453.xyz:8443"
    gethomepage.dev/widget.type: "proxmox"
    gethomepage.dev/widget.url: "https://pve-r720.traefik.svc.cluster.local:8006"
    gethomepage.dev/widget.username: "{{HOMEPAGE_VAR_PROXMOX_USERNAME}}"
    gethomepage.dev/widget.password: "{{HOMEPAGE_VAR_PROXMOX_PASSWORD}}"
    gethomepage.dev/widget.node: "r720"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`r720.pve.646499453.xyz`)
      kind: Rule
      services:
        - name: pve-r720
          port: 8006
          scheme: https
          serversTransport: pve-transport
  tls:
    secretName: wildcards-646499453-xyz-tls

