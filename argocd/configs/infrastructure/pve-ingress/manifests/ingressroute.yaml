apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: pve-transport
  namespace: traefik
spec:
  insecureSkipVerify: true
---
# ==========================================
# r720 Node
# ==========================================
apiVersion: v1
kind: Service
metadata:
  name: pve-r720
  namespace: traefik
spec:
  ports:
    - name: https
      port: 8006
      targetPort: 8006
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: pve-r720
  namespace: traefik
  labels:
    kubernetes.io/service-name: pve-r720
addressType: IPv4
ports:
  - name: https
    port: 8006
    protocol: TCP
endpoints:
  - addresses:
      - 192.168.50.101
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pve-r720
  namespace: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`r720.pve.646499453.xyz`)
      kind: Rule
      services:
        - name: pve-r720
          port: 8006
          scheme: https
          serversTransport: pve-transport
  tls:
    secretName: wildcards-646499453-xyz-tls

---
