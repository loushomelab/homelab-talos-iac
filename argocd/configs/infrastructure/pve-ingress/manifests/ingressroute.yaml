# ==========================================
# Proxmox Backup Server (PBS)
# ==========================================
apiVersion: v1
kind: Service
metadata:
  name: pbs
  namespace: traefik
spec:
  type: ExternalName
  externalName: 192.168.50.154
  ports:
    - name: https
      port: 8007
      targetPort: 8007
      protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pbs
  namespace: traefik
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Proxmox Backup Server"
    gethomepage.dev/description: "PBS installed with helper script as LXC"
    gethomepage.dev/group: "PVE"
    gethomepage.dev/icon: "sh-linux-containers-lxc.svg"
    gethomepage.dev/href: "https://pbs.pve.646499453.xyz:8443"
    gethomepage.dev/showStats: "true"
    gethomepage.dev/proxmoxNode: "r720"
    gethomepage.dev/proxmoxVMID: "103"
    gethomepage.dev/proxmoxType: "lxc"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`pbs.pve.646499453.xyz`)
      kind: Rule
      services:
        - name: pbs
          port: 8007
          scheme: https
          serversTransport: pve-transport
  tls:
    secretName: wildcards-646499453-xyz-tls
