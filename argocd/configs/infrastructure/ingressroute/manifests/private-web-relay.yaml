apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: private-web-relay
  namespace: traefik
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-cluster-store
  target:
    name: private-web-relay
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        # OpenSSH requires the PEM footer to end with a newline.
        id_ed25519: |
          {{ .id_ed25519 }}
  data:
    - secretKey: id_ed25519
      remoteRef:
        key: PRIVATE_WEB_RELAY_SSH_KEY
    - secretKey: config
      remoteRef:
        key: PRIVATE_WEB_RELAY_SSH_CONFIG
    - secretKey: known_hosts
      remoteRef:
        key: PRIVATE_WEB_RELAY_SSH_KNOWN_HOSTS
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: private-web-relay
  namespace: traefik
spec:
  replicas: 1
  selector:
    matchLabels:
      app: private-web-relay
  template:
    metadata:
      labels:
        app: private-web-relay
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ssh
          image: docker.io/alpine/git:v2.52.0@sha256:4a0e72d49596a1f5d3701aeedafdadc5c0da4062be4657c7bdc4017387f591cc
          # The remote key forces one fixed TCP destination and disables SSH forwarding.
          command: ["/bin/busybox", "nc", "-lk", "-p", "13080", "-e"]
          args: ["/usr/bin/ssh", "-T", "-F", "/run/relay/config", "relay-target", "/usr/bin/false"]
          ports:
            - name: http
              containerPort: 13080
          readinessProbe:
            periodSeconds: 30
            tcpSocket:
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: ssh
              mountPath: /run/relay
              readOnly: true
      volumes:
        - name: ssh
          secret:
            secretName: private-web-relay
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: private-web-relay
  namespace: traefik
spec:
  selector:
    app: private-web-relay
  ports:
    - name: http
      port: 13080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: private-web-relay
  namespace: traefik
  annotations:
    tailscale.com/tags: tag:private-web-relay
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - private-web-relay
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: private-web-relay
                port:
                  name: http
