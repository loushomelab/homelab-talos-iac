apiVersion: v1
kind: Service
metadata:
  name: minio-truenas-external
  namespace: traefik
spec:
  ports:
    - name: http
      port: 9001
      targetPort: 9001
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: minio-truenas-external
  namespace: traefik
subsets:
  - addresses:
      - ip: 192.168.50.76
    ports:
      - name: http
        port: 9001
        protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: minio-truenas
  namespace: traefik
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "TrueNAS MinIO"
    gethomepage.dev/description: "S3 Object Storage on TrueNAS"
    gethomepage.dev/group: "Database"
    gethomepage.dev/icon: "minio"
    gethomepage.dev/href: "https://minio.truenas.646499453.xyz:8443"
    gethomepage.dev/pod-selector: ""
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`minio.truenas.646499453.xyz`)
      kind: Rule
      services:
        - name: minio-truenas-external
          port: 9001
  tls:
    secretName: wildcards-646499453-xyz-tls
