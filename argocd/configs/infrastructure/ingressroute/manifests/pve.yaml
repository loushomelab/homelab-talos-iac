apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: pve-insecure-transport
  namespace: traefik
spec:
  insecureSkipVerify: true

---
# ==========================================
# r720 Node
# ==========================================
apiVersion: v1
kind: Service
metadata:
  name: pve-r720
  namespace: traefik
spec:
  ports:
    - name: https
      port: 8006
      targetPort: 8006
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: pve-r720
  namespace: traefik
  labels:
    kubernetes.io/service-name: pve-r720
addressType: IPv4
ports:
  - name: https
    protocol: TCP
    port: 8006
endpoints:
  - addresses:
      - 192.168.50.101
    conditions:
      ready: true
      serving: true
      terminating: false
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pve-r720
  namespace: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`r720.pve.646499453.xyz`)
      kind: Rule
      services:
        - name: pve-r720
          port: 8006
          scheme: https
          serversTransport: pve-insecure-transport
  tls:
    secretName: wildcards-646499453-xyz-tls

---
# ==========================================
# n100x8 is now bare-metal TrueNAS; preserve bookmarks without probing port 8006.
# ==========================================
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: n100x8-truenas-redirect
  namespace: traefik
spec:
  redirectRegex:
    regex: '^https?://n100x8\.pve\.646499453\.xyz(?::[0-9]+)?/(.*)'
    replacement: 'https://truenas.646499453.xyz:8443/${1}'
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pve-n100x8
  namespace: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`n100x8.pve.646499453.xyz`)
      kind: Rule
      middlewares:
        - name: n100x8-truenas-redirect
      services:
        - name: truenas-external
          port: 443
          scheme: https
          serversTransport: truenas-verified-transport
  tls:
    secretName: wildcards-646499453-xyz-tls

