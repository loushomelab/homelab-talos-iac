# Media stack on bare-metal TrueNAS (docker compose, /mnt/tank/docker/truenas-docker).
# HTTP backends, TLS terminated here with the managed wildcard. DNS needs no
# change: *.646499453.xyz already resolves to the Traefik VIP (192.168.50.230).
#
# No Authentik ForwardAuth on these routes by design: every one of them exposes an
# API or a media stream that answers unauthenticated clients, and forward-auth
# replies with a 302 html login page (which breaks Sonarr's API, Seerr's Plex
# login and Plex clients). Protection is lan-only + each app's own auth.
apiVersion: v1
kind: Service
metadata:
  name: truenas-media
  namespace: traefik
spec:
  ports:
    - name: sonarr
      port: 8989
      targetPort: 8989
      protocol: TCP
    - name: radarr
      port: 7878
      targetPort: 7878
      protocol: TCP
    - name: prowlarr
      port: 9696
      targetPort: 9696
      protocol: TCP
    - name: bazarr
      port: 6767
      targetPort: 6767
      protocol: TCP
    - name: seerr
      port: 5055
      targetPort: 5055
      protocol: TCP
    - name: qbittorrent
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: plex
      port: 32400
      targetPort: 32400
      protocol: TCP
    - name: lingarr
      port: 9876
      targetPort: 9876
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: truenas-media
  namespace: traefik
  labels:
    kubernetes.io/service-name: truenas-media
addressType: IPv4
ports:
  - name: sonarr
    protocol: TCP
    port: 8989
  - name: radarr
    protocol: TCP
    port: 7878
  - name: prowlarr
    protocol: TCP
    port: 9696
  - name: bazarr
    protocol: TCP
    port: 6767
  - name: seerr
    protocol: TCP
    port: 5055
  - name: qbittorrent
    protocol: TCP
    port: 8080
  - name: plex
    protocol: TCP
    port: 32400
  - name: lingarr
    protocol: TCP
    port: 9876
endpoints:
  - addresses:
      - 192.168.50.102
    conditions:
      ready: true
      serving: true
      terminating: false
---
# Every app below builds absolute URLs / marks cookies Secure from this header.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: truenas-media-proto
  namespace: traefik
spec:
  headers:
    customRequestHeaders:
      X-Forwarded-Proto: https
---
# qBittorrent rejects a Host header it does not own ("Unauthorized"). It also
# issues a cookie scoped to the host it thinks it is on, so normalise both.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: qbittorrent-host
  namespace: traefik
spec:
  headers:
    customRequestHeaders:
      X-Forwarded-Proto: https
      Host: "127.0.0.1:8080"
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: sonarr
  namespace: traefik
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Sonarr"
    gethomepage.dev/description: "TV library automation"
    gethomepage.dev/group: "Media"
    gethomepage.dev/icon: "sonarr.png"
    gethomepage.dev/href: "https://sonarr.646499453.xyz:8443"
    gethomepage.dev/external: "true"      # runs on the NAS, not a pod
    gethomepage.dev/siteMonitor: "https://sonarr.646499453.xyz:8443"
    gethomepage.dev/widget.type: "sonarr"
    gethomepage.dev/widget.url: "http://192.168.50.102:8989"
    gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_SONARR_API_KEY}}"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`sonarr.646499453.xyz`)
      kind: Rule
      middlewares:
        - name: truenas-media-proto
        - name: lan-only-allowlist
          namespace: monitoring
      services:
        - name: truenas-media
          port: sonarr
  tls:
    secretName: wildcards-646499453-xyz-tls
---
