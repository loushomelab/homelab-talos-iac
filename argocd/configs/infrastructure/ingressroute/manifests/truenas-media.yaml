---
# Web UI only. Apple TV / mobile clients keep using Plex's own discovery + 32400:
# a reverse-proxied Plex works, but direct play is what you actually want, and the
# lan-only gate below would cut off any remote client that trusted this URL.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: plex
  namespace: traefik
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Plex"
    gethomepage.dev/description: "Media server"
    gethomepage.dev/group: "Media"
    gethomepage.dev/icon: "plex.png"
    gethomepage.dev/href: "https://plex.646499453.xyz:8443"
    gethomepage.dev/external: "true"      # runs on the NAS, not a pod
    gethomepage.dev/siteMonitor: "https://plex.646499453.xyz:8443"
    gethomepage.dev/widget.type: "plex"
    gethomepage.dev/widget.url: "http://192.168.50.102:32400"
    gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_PLEX_TOKEN}}"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`plex.646499453.xyz`)
      kind: Rule
      middlewares:
        - name: truenas-media-proto
        - name: lan-only-allowlist
          namespace: monitoring
      services:
        - name: truenas-media
          port: plex
  tls:
    secretName: wildcards-646499453-xyz-tls
---
# Subtitle translation. Talks to ollama on the Mac Studio; the UI is lan-only
