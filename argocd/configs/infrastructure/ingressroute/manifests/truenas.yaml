apiVersion: v1
kind: Service
metadata:
  name: truenas-external
  namespace: traefik
spec:
  type: ExternalName
  externalName: 192.168.50.76
  ports:
    - name: https
      port: 443
      targetPort: 443
      protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: truenas
  namespace: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: HostSNI(`truenas.pve.646499453.xyz`)
      services:
        - name: truenas-external
          port: 443
  tls:
    passthrough: true
