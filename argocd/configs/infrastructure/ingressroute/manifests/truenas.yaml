apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: truenas-verified-transport
  namespace: traefik
spec:
  # The installed NAS certificate has only DNS:localhost in its SAN.
  serverName: localhost
  insecureSkipVerify: false
  rootCAs:
    - configMap: truenas-backend-ca
---
apiVersion: v1
kind: Service
metadata:
  name: truenas-external
  namespace: traefik
spec:
  type: ExternalName
  externalName: 192.168.50.102
  ports:
    - name: https
      port: 443
      targetPort: 443
      protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: truenas
  namespace: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`truenas.646499453.xyz`)
      kind: Rule
      services:
        - name: truenas-external
          port: 443
          scheme: https
          serversTransport: truenas-verified-transport
  tls:
    secretName: wildcards-646499453-xyz-tls
