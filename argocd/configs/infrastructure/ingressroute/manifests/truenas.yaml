apiVersion: v1
kind: Service
metadata:
  name: truenas-external
  namespace: traefik
spec:
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
    - name: https
      port: 443
      targetPort: 443
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: truenas-external
  namespace: traefik
subsets:
  - addresses:
      - ip: 192.168.50.76
    ports:
      - name: http
        port: 80
        protocol: TCP
      - name: https
        port: 443
        protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: truenas-insecure-transport
  namespace: traefik
spec:
  insecureSkipVerify: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  annotations:
    gethomepage.dev/description: "NAS Storage"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: "Storage"
    gethomepage.dev/href: "https://truenas.646499453.xyz:8443"
    gethomepage.dev/icon: "truenas"
    gethomepage.dev/name: "TrueNAS"
    gethomepage.dev/pod-selector: ""
    gethomepage.dev/proxmoxNode: "n100x8"
    gethomepage.dev/proxmoxVMID: "1300"
    gethomepage.dev/proxmoxType: "qemu"
    gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_TRUENAS_API_KEY}}"
    gethomepage.dev/widget.type: "truenas"
    gethomepage.dev/widget.url: "https://192.168.50.76"
    gethomepage.dev/widget.version: "2"
  name: truenas
  namespace: traefik
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`truenas.646499453.xyz`)
    middlewares:
    - name: authentik-forwardauth
      namespace: traefik
    services:
    - name: truenas-external
      port: 443
      scheme: https
      serversTransport: truenas-insecure-transport
  tls:
    secretName: wildcards-646499453-xyz-tls
