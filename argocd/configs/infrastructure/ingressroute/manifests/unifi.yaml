apiVersion: v1
kind: Service
metadata:
  name: unifi-external
  namespace: traefik
spec:
  ports:
    - name: https
      port: 443
      targetPort: 443
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: unifi-external
  namespace: traefik
subsets:
  - addresses:
      - ip: 192.168.50.1
    ports:
      - name: https
        port: 443
        protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: unifi-insecure-transport
  namespace: traefik
spec:
  insecureSkipVerify: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: unifi
  namespace: traefik
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`unifi.646499453.xyz`)
    middlewares:
    - name: authentik-forwardauth
      namespace: traefik
    services:
    - name: unifi-external
      port: 443
      scheme: https
      serversTransport: unifi-insecure-transport
  tls:
    secretName: wildcards-646499453-xyz-tls
