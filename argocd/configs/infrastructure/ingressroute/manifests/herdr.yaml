apiVersion: v1
kind: Service
metadata:
  name: herdr-mac
  namespace: traefik
spec:
  ports:
    - name: http
      port: 7317
      targetPort: 7317
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: herdr-mac
  namespace: traefik
  labels:
    kubernetes.io/service-name: herdr-mac
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: 7317
endpoints:
  - addresses:
      - 192.168.50.79
    conditions:
      ready: true
      serving: true
      terminating: false
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: herdr-https-proto
  namespace: traefik
spec:
  headers:
    customRequestHeaders:
      X-Forwarded-Proto: https
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: herdr
  namespace: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`herdr.646499453.xyz`)
      kind: Rule
      middlewares:
        - name: herdr-https-proto
        - name: lan-only-allowlist
          namespace: monitoring
      services:
        - name: herdr-mac
          port: 7317
  tls:
    secretName: wildcards-646499453-xyz-tls
