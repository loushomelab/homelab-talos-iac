apiVersion: v1
kind: Service
metadata:
  name: synology-external
  namespace: traefik
spec:
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      protocol: TCP
    - name: https
      port: 5001
      targetPort: 5001
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: synology-external
  namespace: traefik
subsets:
  - addresses:
      - ip: 192.168.50.77
    ports:
      - name: http
        port: 5000
        protocol: TCP
      - name: https
        port: 5001
        protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: synology-insecure-transport
  namespace: traefik
spec:
  insecureSkipVerify: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: synology
  namespace: traefik
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`ds920.646499453.xyz`)
    middlewares:
    - name: authentik-forwardauth
      namespace: traefik
    services:
    - name: synology-external
      port: 5001
      scheme: https
      serversTransport: synology-insecure-transport
  tls:
    secretName: wildcards-646499453-xyz-tls
