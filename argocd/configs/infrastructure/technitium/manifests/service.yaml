apiVersion: v1
kind: Service
metadata:
  name: technitium-dns
  namespace: technitium
  labels:
    app.kubernetes.io/name: technitium
spec:
  # Keep DNS on the LAN-only VIP; Local preserves client IPs for the recursion ACL.
  type: LoadBalancer
  loadBalancerIP: 192.168.50.231
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: technitium
  ports:
    - name: dns-udp
      port: 53
      targetPort: dns-udp
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: technitium-web
  namespace: technitium
  labels:
    app.kubernetes.io/name: technitium
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: technitium
  ports:
    - name: web
      port: 5380
      targetPort: web
      protocol: TCP
