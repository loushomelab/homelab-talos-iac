apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: technitium
  namespace: technitium
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Technitium"
    gethomepage.dev/description: "DNS Server"
    gethomepage.dev/group: "Network"
    gethomepage.dev/icon: "sh-technitium.svg"
    gethomepage.dev/href: "https://technitium.646499453.xyz:8443"
    gethomepage.dev/pod-selector: "app.kubernetes.io/name=technitium"
    gethomepage.dev/widget.type: "technitium"
    gethomepage.dev/widget.url: "http://technitium-web.technitium.svc.cluster.local:5380"
    gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_TECHNITIUM_API_KEY}}"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`technitium.646499453.xyz`) && PathPrefix(`/api`)
      kind: Rule
      priority: 100
      middlewares:
        - name: lan-api-allowlist
      services:
        - name: technitium-web
          port: 5380
    - match: Host(`technitium.646499453.xyz`)
      kind: Rule
      services:
        - name: technitium-web
          port: 5380
  tls:
    secretName: wildcards-646499453-xyz-tls
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: lan-api-allowlist
  namespace: technitium
spec:
  ipAllowList:
    sourceRange:
      # The native web console uses the same API as the TFC agent.
      - 192.168.50.0/23
