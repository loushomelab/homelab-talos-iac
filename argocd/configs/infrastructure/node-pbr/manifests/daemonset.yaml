apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-pbr-setup
  namespace: kube-system
  labels:
    app.kubernetes.io/name: node-pbr-setup
    app.kubernetes.io/component: network-routing
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: node-pbr-setup
  template:
    metadata:
      labels:
        app.kubernetes.io/name: node-pbr-setup
    spec:
      hostNetwork: true
      containers:
      - name: pbr-setup
        image: alpine:latest
        command:
        - sh
        - -c
        - |
          echo "Applying Policy-Based Routing for LoadBalancer VIP 192.168.50.230..."
          # 1. 确保路由表 100 指向 UniFi 192.168.50.1
          ip route add default via 192.168.50.1 dev ens18 table 100 2>/dev/null || true
          # 2. 确保源 IP 为 VIP 192.168.50.230 时查找路由表 100
          ip rule add from 192.168.50.230/32 table 100 2>/dev/null || true
          
          echo "PBR rule status:"
          ip rule show | grep 100 || true
          ip route show table 100 || true
          
          sleep infinity
        securityContext:
          capabilities:
            add: ["NET_ADMIN"]
