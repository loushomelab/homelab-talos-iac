# Cluster-scoped. Applied only after the operator chart has installed
# tailscale.com CRDs (tailscale-connector sync wave is after tailscale-operator).
# Cluster subnet router for Home Assistant, Technitium DNS, NAS, Mac Studio,
# and Traefik VIP host routes.
# Not an exit node and not an app connector.
apiVersion: tailscale.com/v1alpha1
kind: Connector
metadata:
  name: lan-router-k8s
spec:
  hostname: lan-router-k8s
  tags: ["tag:lan-router"]
  subnetRouter:
    advertiseRoutes: ["192.168.50.120/32", "192.168.50.231/32", "192.168.50.102/32", "192.168.50.79/32", "192.168.50.230/32"]
