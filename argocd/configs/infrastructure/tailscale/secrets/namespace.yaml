apiVersion: v1
kind: Namespace
metadata:
  name: tailscale
  labels:
    # Subnet-router proxy pods are privileged (NET_ADMIN + /dev/net/tun) by default.
    # Talos Pod Security Admission rejects them unless this namespace allows it.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
