# OAuth client for the Tailscale operator. The chart mounts Secret/operator-oauth
# (keys client_id, client_secret) and does not create that Secret when
# oauth.clientId is left empty. Values come from Doppler project k8s / config prd
# via ClusterSecretStore doppler-cluster-store — same store as homepage-secrets.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: operator-oauth
  namespace: tailscale
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-cluster-store
  target:
    name: operator-oauth
    creationPolicy: Owner
  data:
    - secretKey: client_id
      remoteRef:
        key: TAILSCALE_OPERATOR_OAUTH_CLIENT_ID
    - secretKey: client_secret
      remoteRef:
        key: TAILSCALE_OPERATOR_OAUTH_CLIENT_SECRET
