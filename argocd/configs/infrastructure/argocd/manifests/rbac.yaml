apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-rbac-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-rbac-cm
    app.kubernetes.io/part-of: argocd
data:
  # Give full admin access to users logging in via Authentik
  policy.csv: |
    g, authentik Admins, role:admin
    g, homepage, role:readonly
  scopes: '[groups]'
