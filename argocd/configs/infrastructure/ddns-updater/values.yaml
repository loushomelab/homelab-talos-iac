config:
  settings:
    - provider: cloudflare
      zone_identifier: 'your-zone-id'
      domain: '646499453.xyz'
      host: 'langshi.ddns'
      ttl: 300
      token: 'your-cloudflare-api-token'
      proxied: false
      ip_version: ipv4

ddns:
  period: 5m
  updateCooldownPeriod: 5m

persistence:
  enabled: false

ingress:
  enabled: false
