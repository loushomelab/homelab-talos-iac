apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-apps
  namespace: authentik
data:
  apps.yaml: |
    version: 1
    metadata:
      name: Applications Integration
    entries:
      # --- Custom Scope Mappings ---
      - identifiers:
          name: ArgoCD Groups
        model: authentik_providers_oauth2.scopemapping
        id: scope-argocd-groups
        attrs:
          scope_name: groups
          description: "Map Authentik groups to OIDC groups claim"
          expression: |
            return {
                "groups": [group.name for group in request.user.ak_groups.all()]
            }

      # --- ArgoCD ---
      - identifiers:
          name: ArgoCD
        model: authentik_providers_oauth2.oauth2provider
        id: argocd-provider
        attrs:
          name: ArgoCD
          client_id: argocd
          client_secret: !Env AUTHENTIK_OIDC_ARGOCD_SECRET
          client_type: confidential
          grant_types:
            - authorization_code
            - refresh_token
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, groups]]
          redirect_uris:
            - matching_mode: strict
              url: https://argocd.646499453.xyz:8443/api/dex/callback
            - matching_mode: strict
              url: https://argocd.646499453.xyz:8443/auth/callback
      - identifiers:
          slug: argocd
        model: authentik_core.application
        attrs:
          name: ArgoCD
          provider: !KeyOf argocd-provider
          icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/argo-cd.png
          meta_launch_url: https://argocd.646499453.xyz:8443/

      # --- Homepage (OIDC) ---
      # 迁移清理（必需，勿删）：Homepage 早期是 forward-auth 的 ProxyProvider（见 6151089）。
      # 1) 蓝图不会删除旧对象，改 model 也不会——它只做 upsert，没有 prune。
      # 2) ProxyProvider 继承自 OAuth2Provider（Django 多表继承），所以下面这条
      #    oauth2provider 的 identifiers(name=Homepage) 会命中旧的 proxy 记录，
      #    变成"就地改造"而非新建。
      # 3) authentik 的 providers/proxy/apps.py 有 @reconcile_tenant 启动钩子
      #    proxy_set_defaults()，每次进程启动都会遍历 ProxyProvider.objects.all()
      #    执行 set_oauth_defaults()，把 redirect_uris / grant_types / signing_key
      #    强制重置为 proxy 默认值（唯独不碰 client_id）。启动钩子总是最后跑，
      #    蓝图永远赢不了 → OIDC 登录报 Redirect URI Error，且每次重启复发。
      # 因此必须先删掉旧 proxy 记录，才能创建纯 OAuth2Provider。
      # Application.provider 是 on_delete=SET_DEFAULT，删除只置空不会删掉 Application，
      # 下面的 application 条目会在同一趟里重新绑定。对象不存在时该条目为 no-op。
      - identifiers:
          name: Homepage
        model: authentik_providers_proxy.proxyprovider
        state: absent
      - identifiers:
          name: Homepage
        model: authentik_providers_oauth2.oauth2provider
        id: homepage-provider
        attrs:
          name: Homepage
          client_id: homepage
          client_secret: !Env AUTHENTIK_OIDC_HOMEPAGE_SECRET
          client_type: confidential
          grant_types:
            - authorization_code
            - refresh_token
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
          redirect_uris:
            - matching_mode: strict
              url: https://homepage.646499453.xyz:8443/api/auth/callback/homepage-oidc
      - identifiers:
          slug: homepage
        model: authentik_core.application
        attrs:
          name: Homepage
          provider: !KeyOf homepage-provider
          icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/homepage.png
          meta_launch_url: https://homepage.646499453.xyz:8443/

      # --- Traefik Dashboard (Forward Auth) ---
      - identifiers:
          name: Traefik Dashboard
        model: authentik_providers_proxy.proxyprovider
        id: traefik-provider
        attrs:
          name: Traefik Dashboard
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          internal_host: ""
          external_host: https://traefik.646499453.xyz:8443
          mode: forward_single
      - identifiers:
          slug: traefik-dashboard
        model: authentik_core.application
        attrs:
          name: Traefik Dashboard
          provider: !KeyOf traefik-provider
          icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/traefik.png
          meta_launch_url: https://traefik.646499453.xyz:8443/

      # --- Longhorn UI (Forward Auth) ---
      - identifiers:
          name: Longhorn UI
        model: authentik_providers_proxy.proxyprovider
        id: longhorn-provider
        attrs:
          name: Longhorn UI
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          internal_host: ""
          external_host: https://longhorn.646499453.xyz:8443
          mode: forward_single
      - identifiers:
          slug: longhorn-ui
        model: authentik_core.application
        attrs:
          name: Longhorn UI
          provider: !KeyOf longhorn-provider
          icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/longhorn.png
          meta_launch_url: https://longhorn.646499453.xyz:8443/


      # --- Grafana ---
      - identifiers:
          name: Grafana Groups
        model: authentik_providers_oauth2.scopemapping
        id: scope-grafana-groups
        attrs:
          scope_name: grafana_groups
          description: "Map Authentik groups to OIDC groups claim for Grafana"
          expression: |
            return {
                "groups": [group.name for group in request.user.ak_groups.all()]
            }
      - identifiers:
          name: Grafana
        model: authentik_providers_oauth2.oauth2provider
        id: grafana-provider
        attrs:
          name: Grafana
          client_id: grafana
          client_secret: !Env AUTHENTIK_OIDC_GRAFANA_SECRET
          client_type: confidential
          grant_types:
            - authorization_code
            - refresh_token
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, grafana_groups]]
          redirect_uris:
            - matching_mode: strict
              url: https://grafana.646499453.xyz:8443/login/generic_oauth
      - identifiers:
          slug: grafana
        model: authentik_core.application
        attrs:
          name: Grafana
          provider: !KeyOf grafana-provider
          icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/grafana.png
          meta_launch_url: https://grafana.646499453.xyz:8443/

      # --- Pulse (OIDC) ---
      - identifiers:
          name: Pulse
        model: authentik_providers_oauth2.oauth2provider
        id: pulse-provider
        attrs:
          name: Pulse
          client_id: pulse
          client_secret: !Env AUTHENTIK_OIDC_PULSE_SECRET
          client_type: confidential
          grant_types:
            - authorization_code
            - refresh_token
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, groups]]
          redirect_uris:
            - matching_mode: regex
              url: https://pulse.646499453.xyz:8443/api/oidc/.*
            - matching_mode: strict
              url: https://pulse.646499453.xyz:8443/api/oidc/callback
      - identifiers:
          slug: pulse
        model: authentik_core.application
        attrs:
          name: Pulse
          provider: !KeyOf pulse-provider
          icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/pulse.png
          meta_launch_url: https://pulse.646499453.xyz:8443/

      # --- Synology DSM (OIDC) ---
      - identifiers:
          name: Synology DSM
        model: authentik_providers_oauth2.oauth2provider
        id: synology-provider
        attrs:
          name: Synology DSM
          client_id: synology
          client_secret: !Env AUTHENTIK_OIDC_SYNOLOGY_SECRET
          client_type: confidential
          grant_types:
            - authorization_code
            - refresh_token
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, groups]]
          redirect_uris:
            - matching_mode: regex
              url: https://ds920.646499453.xyz:8443/.*
            - matching_mode: strict
              url: https://ds920.646499453.xyz:8443/
      - identifiers:
          slug: synology-dsm
        model: authentik_core.application
        attrs:
          name: Synology DSM
          provider: !KeyOf synology-provider
          icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/synology.png
          meta_launch_url: https://ds920.646499453.xyz:8443/

      # --- TrueNAS UI (Forward Auth) ---
      - identifiers:
          name: TrueNAS UI
        model: authentik_providers_proxy.proxyprovider
        id: truenas-provider
        attrs:
          name: TrueNAS UI
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          internal_host: ""
          external_host: https://truenas.pve.646499453.xyz:8443
          mode: forward_single
      - identifiers:
          slug: truenas-ui
        model: authentik_core.application
        attrs:
          name: TrueNAS UI
          provider: !KeyOf truenas-provider
          icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/truenas.png
          meta_launch_url: https://truenas.pve.646499453.xyz:8443/

      # --- Forgejo (OIDC) ---
      - identifiers:
          name: Forgejo
        model: authentik_providers_oauth2.oauth2provider
        id: forgejo-provider
        attrs:
          name: Forgejo
          client_id: forgejo
          client_secret: !Env AUTHENTIK_OIDC_FORGEJO_SECRET
          client_type: confidential
          grant_types:
            - authorization_code
            - refresh_token
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, groups]]
          redirect_uris:
            - matching_mode: strict
              url: https://forgejo.646499453.xyz:8443/user/oauth2/Authentik/callback
      - identifiers:
          slug: forgejo
        model: authentik_core.application
        attrs:
          name: Forgejo
          provider: !KeyOf forgejo-provider
          icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/gitea.png
          meta_launch_url: https://forgejo.646499453.xyz:8443/

      # --- Embedded Outpost Update ---
      # Automatically bind these proxy providers to the embedded outpost
      - identifiers:
          name: authentik Embedded Outpost
        model: authentik_outposts.outpost
        attrs:
          providers:
            - !KeyOf traefik-provider
            - !KeyOf longhorn-provider
            - !KeyOf truenas-provider
