apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-apps
  namespace: authentik
data:
  apps.yaml: |
    version: 1
    metadata:
      name: Applications Integration
    entries:
      # --- Custom Scope Mappings ---
      - identifiers:
          name: ArgoCD Groups
        model: authentik_providers_oauth2.scopemapping
        id: scope-argocd-groups
        attrs:
          scope_name: groups
          description: "Map Authentik groups to OIDC groups claim"
          expression: |
            return {
                "groups": [group.name for group in request.user.ak_groups.all()]
            }

      # --- ArgoCD ---
      - identifiers:
          name: ArgoCD
        model: authentik_providers_oauth2.oauth2provider
        id: argocd-provider
        attrs:
          name: ArgoCD
          client_id: argocd
          client_secret: !Env AUTHENTIK_OIDC_ARGOCD_SECRET
          client_type: confidential
          grant_types:
            - authorization_code
            - refresh_token
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, groups]]
          redirect_uris:
            - matching_mode: strict
              url: https://argocd.646499453.xyz:8443/api/dex/callback
            - matching_mode: strict
              url: https://argocd.646499453.xyz:8443/auth/callback
      - identifiers:
          slug: argocd
        model: authentik_core.application
        attrs:
          name: ArgoCD
          provider: !KeyOf argocd-provider
          icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/argo-cd.png
          meta_launch_url: https://argocd.646499453.xyz:8443/

      # --- Homepage (OIDC) ---
      - identifiers:
          name: Homepage
        model: authentik_providers_oauth2.oauth2provider
        id: homepage-provider
        attrs:
          name: Homepage
          client_id: homepage
          client_secret: !Env AUTHENTIK_OIDC_HOMEPAGE_SECRET
          client_type: confidential
          grant_types:
            - authorization_code
            - refresh_token
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
          redirect_uris:
            - matching_mode: strict
              url: https://homepage.646499453.xyz:8443/api/auth/callback/homepage-oidc
      - identifiers:
          slug: homepage
        model: authentik_core.application
        attrs:
          name: Homepage
          provider: !KeyOf homepage-provider
          icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/homepage.png
          meta_launch_url: https://homepage.646499453.xyz:8443/

      # --- Traefik Dashboard (Forward Auth) ---
      - identifiers:
          name: Traefik Dashboard
        model: authentik_providers_proxy.proxyprovider
        id: traefik-provider
        attrs:
          name: Traefik Dashboard
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          internal_host: ""
          external_host: https://traefik.646499453.xyz:8443
          mode: forward_single
      - identifiers:
          slug: traefik-dashboard
        model: authentik_core.application
        attrs:
          name: Traefik Dashboard
          provider: !KeyOf traefik-provider
          icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/traefik.png
          meta_launch_url: https://traefik.646499453.xyz:8443/

      # --- Longhorn UI (Forward Auth) ---
      - identifiers:
          name: Longhorn UI
        model: authentik_providers_proxy.proxyprovider
        id: longhorn-provider
        attrs:
          name: Longhorn UI
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          internal_host: ""
          external_host: https://longhorn.646499453.xyz:8443
          mode: forward_single
      - identifiers:
          slug: longhorn-ui
        model: authentik_core.application
        attrs:
          name: Longhorn UI
          provider: !KeyOf longhorn-provider
          icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/longhorn.png
          meta_launch_url: https://longhorn.646499453.xyz:8443/


      # --- Grafana ---
      - identifiers:
          name: Grafana Groups
        model: authentik_providers_oauth2.scopemapping
        id: scope-grafana-groups
        attrs:
          scope_name: grafana_groups
          description: "Map Authentik groups to OIDC groups claim for Grafana"
          expression: |
            return {
                "groups": [group.name for group in request.user.ak_groups.all()]
            }
      - identifiers:
          name: Grafana
        model: authentik_providers_oauth2.oauth2provider
        id: grafana-provider
        attrs:
          name: Grafana
          client_id: grafana
          client_secret: !Env AUTHENTIK_OIDC_GRAFANA_SECRET
          client_type: confidential
          grant_types:
            - authorization_code
            - refresh_token
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, grafana_groups]]
          redirect_uris:
            - matching_mode: strict
              url: https://grafana.646499453.xyz:8443/login/generic_oauth
      - identifiers:
          slug: grafana
        model: authentik_core.application
        attrs:
          name: Grafana
          provider: !KeyOf grafana-provider
          icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/grafana.png
          meta_launch_url: https://grafana.646499453.xyz:8443/

      # --- Pulse (OIDC) ---
      - identifiers:
          name: Pulse
        model: authentik_providers_oauth2.oauth2provider
        id: pulse-provider
        attrs:
          name: Pulse
          client_id: pulse
          client_secret: !Env AUTHENTIK_OIDC_PULSE_SECRET
          client_type: confidential
          grant_types:
            - authorization_code
            - refresh_token
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, groups]]
          redirect_uris:
            - matching_mode: regex
              url: https://pulse.646499453.xyz:8443/api/oidc/.*
            - matching_mode: strict
              url: https://pulse.646499453.xyz:8443/api/oidc/callback
      - identifiers:
          slug: pulse
        model: authentik_core.application
        attrs:
          name: Pulse
          provider: !KeyOf pulse-provider
          icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/pulse.png
          meta_launch_url: https://pulse.646499453.xyz:8443/

      # --- Embedded Outpost Update ---
      # Automatically bind these proxy providers to the embedded outpost
      - identifiers:
          name: authentik Embedded Outpost
        model: authentik_outposts.outpost
        attrs:
          providers:
            - !KeyOf traefik-provider
            - !KeyOf longhorn-provider
