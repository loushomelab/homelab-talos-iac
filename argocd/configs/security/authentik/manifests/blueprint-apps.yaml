apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-apps
  namespace: authentik
data:
  apps.yaml: |
    version: 1
    metadata:
      name: Applications Integration
    entries:
      # --- ArgoCD ---
      - identifiers:
          name: ArgoCD
        model: authentik_providers_oauth2.oauth2provider
        id: argocd-provider
        attrs:
          name: ArgoCD
          client_id: argocd
          client_secret: !Env AUTHENTIK_OIDC_ARGOCD_SECRET
          client_type: confidential
          grant_types:
            - authorization_code
            - refresh_token
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
          redirect_uris:
            - matching_mode: strict
              url: https://argocd.646499453.xyz/api/dex/callback
            - matching_mode: strict
              url: https://argocd.646499453.xyz/auth/callback
      - identifiers:
          slug: argocd
        model: authentik_core.application
        attrs:
          name: ArgoCD
          provider: !KeyOf argocd-provider
          icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/argocd.png
          meta_launch_url: https://argocd.646499453.xyz/

      # --- Homepage (Forward Auth) ---
      - identifiers:
          name: Homepage
        model: authentik_providers_proxy.proxyprovider
        id: homepage-provider
        attrs:
          name: Homepage
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          internal_host: ""
          external_host: https://homepage.646499453.xyz
          mode: forward_single
      - identifiers:
          slug: homepage
        model: authentik_core.application
        attrs:
          name: Homepage
          provider: !KeyOf homepage-provider
          icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/homepage.png
          meta_launch_url: https://homepage.646499453.xyz/

      # --- Traefik Dashboard (Forward Auth) ---
      - identifiers:
          name: Traefik Dashboard
        model: authentik_providers_proxy.proxyprovider
        id: traefik-provider
        attrs:
          name: Traefik Dashboard
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          internal_host: ""
          external_host: https://traefik.646499453.xyz
          mode: forward_single
      - identifiers:
          slug: traefik-dashboard
        model: authentik_core.application
        attrs:
          name: Traefik Dashboard
          provider: !KeyOf traefik-provider
          icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/traefik.png
          meta_launch_url: https://traefik.646499453.xyz/

      # --- Embedded Outpost Update ---
      # Automatically bind these proxy providers to the embedded outpost
      - identifiers:
          name: authentik Embedded Outpost
        model: authentik_outposts.outpost
        attrs:
          providers:
            - !KeyOf homepage-provider
            - !KeyOf traefik-provider
