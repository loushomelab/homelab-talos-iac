apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-pve
  namespace: authentik
data:
  pve.yaml: |
    version: 1
    metadata:
      name: Proxmox VE Integration
    entries:
      - identifiers:
          name: Proxmox VE
        model: authentik_providers_oauth2.oauth2provider
        id: pve-provider
        attrs:
          name: Proxmox VE
          client_id: proxmox-ve
          client_secret: !Env AUTHENTIK_OIDC_PROXMOX_SECRET
          client_type: confidential
          grant_types:
            - authorization_code
            - refresh_token
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, groups]]
          redirect_uris:
            - matching_mode: strict
              url: https://r720.pve.646499453.xyz:8443
            - matching_mode: strict
              url: https://n100x8.pve.646499453.xyz:8443
            - matching_mode: strict
              url: https://3960x.pve.646499453.xyz:8443
            - matching_mode: strict
              url: https://1920x.pve.646499453.xyz:8443
      - identifiers:
          slug: proxmox-ve
        model: authentik_core.application
        attrs:
          name: Proxmox VE
          provider: !KeyOf pve-provider
          icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/proxmox.png
          meta_launch_url: https://r720.pve.646499453.xyz:8443/
      - identifiers:
          name: Proxmox Backup Server
        model: authentik_providers_oauth2.oauth2provider
        id: pbs-provider
        attrs:
          name: Proxmox Backup Server
          client_id: proxmox-backup-server
          client_secret: !Env AUTHENTIK_OIDC_PROXMOX_SECRET
          client_type: confidential
          grant_types:
            - authorization_code
            - refresh_token
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, groups]]
          redirect_uris:
            - matching_mode: strict
              url: https://pbs.pve.646499453.xyz:8443
      - identifiers:
          slug: proxmox-backup-server
        model: authentik_core.application
        attrs:
          name: Proxmox Backup Server
          provider: !KeyOf pbs-provider
          icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/proxmox.png
          meta_launch_url: https://pbs.pve.646499453.xyz:8443/
