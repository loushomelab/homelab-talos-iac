authentik:
  enabled: true
  log_level: info
  
  postgresql:
    enabled: false
  redis:
    enabled: false
    
server:
  enabled: true
  
  # Inject secrets from Doppler
  envFrom:
    - secretRef:
        name: authentik-secrets

  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - authentik.646499453.xyz
    paths:
      - /
    pathType: Prefix
    tls:
      - secretName: wildcards-646499453-xyz-tls
        hosts:
          - authentik.646499453.xyz

worker:
  enabled: true
  # Inject secrets from Doppler
  envFrom:
    - secretRef:
        name: authentik-secrets

blueprints:
  configMaps:
    - authentik-blueprint-pve
    - authentik-blueprint-webauthn
    - authentik-blueprint-apps
