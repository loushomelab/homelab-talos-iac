apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-ddns-secrets
  namespace: ddns
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-cluster-store
  target:
    name: cloudflare-ddns-secrets-env
    creationPolicy: Owner
  data:
    - secretKey: API_KEY
      remoteRef:
        key: CLOUDFLARE_API_TOKEN
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-secrets
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-cluster-store
  target:
    name: argocd-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        accounts.homepage.tokens: '[{"id":"62e71829-7cf8-4748-a10b-7549ec75e203","iat":1786780128}]'
        oidc.authentik.clientSecret: '{{ .authentik_secret }}'
        server.secretkey: '{{ .server_secretkey }}'
  data:
    - secretKey: authentik_secret
      remoteRef:
        key: AUTHENTIK_OIDC_ARGOCD_SECRET
    - secretKey: server_secretkey
      remoteRef:
        key: ARGOCD_SERVER_SECRETKEY
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-cluster-store
  target:
    name: cloudflare-api-token
    creationPolicy: Owner
  data:
    - secretKey: CLOUDFLARE_API_TOKEN
      remoteRef:
        key: CLOUDFLARE_API_TOKEN

