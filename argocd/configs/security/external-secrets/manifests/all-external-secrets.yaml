      remoteRef:
        key: AUTHENTIK_ERROR_REPORTING__ENABLED
    - secretKey: AUTHENTIK_SECRET_KEY
      remoteRef:
        key: AUTHENTIK_SECRET_KEY
    - secretKey: AUTHENTIK_OIDC_PROXMOX_SECRET
      remoteRef:
        key: AUTHENTIK_OIDC_PROXMOX_SECRET
    - secretKey: AUTHENTIK_OIDC_ARGOCD_SECRET
