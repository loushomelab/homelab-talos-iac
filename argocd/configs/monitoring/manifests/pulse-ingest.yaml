apiVersion: v1
kind: Service
metadata:
  name: pulse-agent
  namespace: monitoring
  labels:
    app.kubernetes.io/name: pulse
    app.kubernetes.io/component: agent-ingest
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pulse
    app.kubernetes.io/instance: pulse
  ports:
    - name: agent-ingest
      port: 7656
      targetPort: 7656
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pulse-agent
  namespace: monitoring
  labels:
    app.kubernetes.io/name: pulse
    app.kubernetes.io/component: agent-ingest
spec:
  ingressClassName: traefik
  rules:
    - host: pulse-ingest.646499453.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pulse-agent
                port:
                  number: 7656
  tls:
    - secretName: wildcards-646499453-xyz-tls
      hosts:
        - pulse-ingest.646499453.xyz
