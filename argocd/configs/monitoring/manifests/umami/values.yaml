ingress:
  enabled: true
  ingressClassName: traefik
  hosts:
    - host: umami.646499453.xyz
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: wildcards-646499453-xyz-tls
      hosts:
        - umami.646499453.xyz
  annotations:
    gethomepage.dev/enabled: '"true"'
    gethomepage.dev/name: '"Umami"'
    gethomepage.dev/description: '"Web Analytics"'
    gethomepage.dev/group: '"Services"'
    gethomepage.dev/icon: '"umami.png"'
    gethomepage.dev/href: '"https://umami.646499453.xyz"'

postgresql:
  enabled: false

database:
  external:
    host: 192.168.50.152 # Consider storing in secret DB_OBS_POSTGRESQL__HOST if shared
    name: "" # Should be provided from UMAMI_DB_NAME env var
    username: "" # Should be provided from UMAMI_DB_USER env var
    existingSecret: monitoring-secrets
    existingSecretPasswordKey: UMAMI_DB_PASSWORD

umami:
  existingSecret: monitoring-secrets
  existingSecretKey: UMAMI_APP_SECRET

env:
  - name: DATABASE_URL
    value: postgresql://$(UMAMI_DB_USER):$(UMAMI_DB_PASSWORD)@$(GRAFANA_DB_HOST):5432/$(UMAMI_DB_NAME)
envFrom:
  - secretRef:
      name: monitoring-secrets
