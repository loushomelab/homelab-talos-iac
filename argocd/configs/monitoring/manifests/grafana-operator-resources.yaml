apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: external-grafana
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    dashboards: unpoller
spec:
  external:
    url: http://grafana.monitoring.svc.cluster.local:80
    adminUser:
      name: grafana-admin-credentials
      key: admin-user
    adminPassword:
      name: grafana-admin-credentials
      key: admin-password
