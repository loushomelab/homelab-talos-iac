envFromSecret: monitoring-secrets
adminUser: admin
grafana.ini:
  database:
    type: postgres
    host: $__env{GRAFANA_DB_HOST}:5432
    name: $__env{GRAFANA_DB_NAME}
    user: $__env{GRAFANA_DB_USER}
    password: $__env{GRAFANA_DB_PASSWORD}
    ssl_mode: disable
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
    - name: Mimir (Prometheus)
      type: prometheus
      access: proxy
      url: http://mimir-distributed-gateway.monitoring.svc.cluster.local
      isDefault: true
      jsonData:
        httpMethod: POST
        timeInterval: 15s
    - name: Pyroscope
      type: grafana-pyroscope-datasource
      access: proxy
      url: http://pyroscope.monitoring.svc:4040
      jsonData:
        minStep: 15s
ingress:
  enabled: true
  ingressClassName: traefik
  hosts:
  - grafana.646499453.xyz
  paths:
  - /
  pathType: Prefix
  tls:
  - secretName: wildcards-646499453-xyz-tls
    hosts:
    - grafana.646499453.xyz
  annotations:
    gethomepage.dev/enabled: '"true"'
    gethomepage.dev/name: '"Grafana"'
    gethomepage.dev/description: '"Data Visualization & Monitoring"'
    gethomepage.dev/group: '"Dashboards"'
    gethomepage.dev/icon: '"grafana.png"'
    gethomepage.dev/href: '"https://grafana.646499453.xyz"'
    gethomepage.dev/widget.type: '"grafana"'
    gethomepage.dev/widget.url: '"http://grafana.monitoring.svc.cluster.local:80"'
    gethomepage.dev/widget.username: '"{{HOMEPAGE_VAR_GRAFANA_USERNAME}}"'
    gethomepage.dev/widget.password: '"{{HOMEPAGE_VAR_GRAFANA_PASSWORD}}"'
