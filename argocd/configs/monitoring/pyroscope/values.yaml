# Grafana Pyroscope Helm Chart Values
# Optimized for Homelab (single replica monolithic mode, backed by MinIO)
# Docs: https://grafana.com/docs/pyroscope/latest/

# Global or component-level environment variables from Doppler
pyroscope:
  extraEnvFrom:
    - secretRef:
        name: monitoring-secrets

  # Pyroscope binary does not natively expand environment variables in its YAML config.
  # We use Kubernetes' native $(VAR) resolution in extraArgs to safely inject S3 secrets at runtime!
  extraArgs:
    storage.s3.endpoint: "$(S3_ENDPOINT)"
    storage.s3.secret-access-key: "$(S3_PYROSCOPE_PASSWORD)"

  structuredConfig:
    multitenancy_enabled: false

    # Store profiling block data in external MinIO (referenced in minio.tf)
    storage:
      backend: s3
      s3:
        access_key_id: pyroscope # 使用专门的 IAM 账号，拒绝 root 混用
        bucket_name: s3-pyroscope
        insecure: true # MinIO without TLS inside K8s network
        # endpoint and secret_access_key are injected via extraArgs above to avoid parsing errors

# Disable MinIO sub-chart as we use external MinIO (configured in minio.tf)
minio:
  enabled: false

# Configure single replica for resource efficiency
replicaCount: 1

# Disable high-availability/multi-replica compactor/distributor/etc. if chart is in distributed mode
# For monolithic mode (default in simple configurations), this is extremely resource-light
