pyroscope:
  extraEnvFrom:
  - secretRef:
      name: monitoring-secrets
  extraArgs:
    storage.s3.endpoint: $(S3_ENDPOINT)
    storage.s3.secret-access-key: $(S3_PYROSCOPE_PASSWORD)
  structuredConfig:
    multitenancy_enabled: false
    storage:
      backend: s3
      s3:
        access_key_id: pyroscope
        bucket_name: s3-pyroscope
        insecure: true
minio:
  enabled: false
replicaCount: 1
ingress:
  enabled: true
  className: traefik
  hosts:
  - pyroscope.646499453.xyz
  tls:
  - secretName: wildcards-646499453-xyz-tls
    hosts:
    - pyroscope.646499453.xyz
  annotations:
    gethomepage.dev/enabled: '"true"'
    gethomepage.dev/name: '"Pyroscope"'
    gethomepage.dev/description: '"Continuous Profiling"'
    gethomepage.dev/group: '"Monitoring"'
    gethomepage.dev/icon: '"pyroscope.png"'
    gethomepage.dev/href: '"https://pyroscope.646499453.xyz"'
    traefik.ingress.kubernetes.io/router.middlewares: monitoring-lan-only-allowlist@kubernetescrd
