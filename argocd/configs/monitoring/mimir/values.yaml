global:
  extraEnvFrom:
  - secretRef:
      name: monitoring-secrets
mimir:
  structuredConfig:
    multitenancy_enabled: false
    usage_stats:
      enabled: false
    ingest_storage:
      enabled: false
    ingester:
      push_grpc_method_enabled: true
      ring:
        replication_factor: 1
    common:
      storage:
        backend: s3
        s3:
          endpoint: ${S3_ENDPOINT}
          access_key_id: mimir
          secret_access_key: ${S3_MIMIR_PASSWORD}
          bucket_name: s3-mimir
          insecure: true
    blocks_storage:
      backend: s3
      s3:
        endpoint: ${S3_ENDPOINT}
        access_key_id: mimir
        secret_access_key: ${S3_MIMIR_PASSWORD}
        bucket_name: s3-mimir
        insecure: true
      tsdb:
        dir: /data/tsdb
    limits:
      max_global_series_per_user: 5000000
distributor:
  replicas: 1
ingester:
  replicas: 1
  persistentVolume:
    enabled: false
  zones: []
querier:
  replicas: 1
query_frontend:
  replicas: 1
store_gateway:
  replicas: 1
  persistentVolume:
    enabled: false
  zones: []
compactor:
  replicas: 1
  persistentVolume:
    enabled: false
ruler:
  enabled: false
alertmanager:
  enabled: false
gateway:
  enabled: true
  replicas: 1
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
    - host: mimir.646499453.xyz
      paths:
      - path: /
        pathType: Prefix
    tls:
    - secretName: wildcards-646499453-xyz-tls
      hosts:
      - mimir.646499453.xyz
    annotations:
      gethomepage.dev/enabled: '"true"'
      gethomepage.dev/name: '"Mimir"'
      gethomepage.dev/description: '"Scalable Long-term Metrics"'
      gethomepage.dev/group: '"Monitoring"'
      gethomepage.dev/icon: '"mimir.png"'
      gethomepage.dev/href: '"https://mimir.646499453.xyz"'
      traefik.ingress.kubernetes.io/router.middlewares: monitoring-lan-only-allowlist@kubernetescrd
minio:
  enabled: false
kafka:
  enabled: false
