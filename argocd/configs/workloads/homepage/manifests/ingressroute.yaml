apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`homepage.646499453.xyz`)
      kind: Rule
      services:
        - name: homepage
          port: 3000
      middlewares:
        - name: authentik-forwardauth
          namespace: traefik
  tls:
    secretName: wildcards-646499453-xyz-tls
