- datetime:
    text_size: xl
    locale: ch
    format:
      weekday: short
      month: short
      day: numeric
      hour: 2-digit
      minute: 2-digit
      hour12: false
- kubernetes:
    cluster:
      show: true
      cpu: true
      memory: true
      showLabel: true
      label: "Talos-Homelab"
    nodes:
      show: true
      cpu: true
      memory: true
      showLabel: true
- search:
    provider: [google, duckduckgo, bing, baidu, brave]
    focus: true # Optional, will set focus to the search bar on page load
    showSearchSuggestions: true # Optional, will show search suggestions. Defaults to false
    target: _blank # One of _self, _blank, _parent or _top