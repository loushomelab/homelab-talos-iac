apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: homepage
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/restartedAt: "2026-10-08T08:35:00Z"
      labels:
        app.kubernetes.io/name: homepage
    spec:
      serviceAccountName: homepage
      automountServiceAccountToken: true
      dnsPolicy: ClusterFirst
      enableServiceLinks: true
      containers:
        - name: homepage
          image: "ghcr.io/gethomepage/homepage:v2.3.0"
          imagePullPolicy: Always
          command:
            - /bin/sh
            - -c
            - |
              node --input-type=module -e '
              import fs from "fs";
              try {
                const mod = await import("/app/.next/server/pages/index.js");
                const m = await mod.default;
                const getStaticProps = Object.getOwnPropertyDescriptor(m, "getStaticProps").get();
                const res = await getStaticProps({ locale: "en" });
                if (res?.props?.initialSettings) {
                  const s = res.props.initialSettings;
                  for (const lang of ["en"]) {
                    const jsonPath = `/app/.next/server/pages/${lang}.json`;
                    if (fs.existsSync(jsonPath)) {
                      const data = JSON.parse(fs.readFileSync(jsonPath, "utf8"));
                      data.pageProps.initialSettings = s;
                      fs.writeFileSync(jsonPath, JSON.stringify(data), "utf8");
                    }
                    const htmlPath = `/app/.next/server/pages/${lang}.html`;
                    if (fs.existsSync(htmlPath)) {
                      let html = fs.readFileSync(htmlPath, "utf8");
                      const match = html.match(/<script id="__NEXT_DATA__" type="application\/json">([^<]+)<\/script>/);
                      if (match) {
                        const nextData = JSON.parse(match[1]);
                        nextData.props.pageProps.initialSettings = s;
                        html = html.replace(match[0], `<script id="__NEXT_DATA__" type="application/json">${JSON.stringify(nextData)}</script>`);
                        fs.writeFileSync(htmlPath, html, "utf8");
                      }
                    }
                  }
                }
              } catch (e) {
                console.error("Warning: pre-seeding initialSettings failed:", e);
              }
              '
              exec node server.js
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: TZ
              value: "Asia/Shanghai"
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "$(MY_POD_IP):3000,homepage.646499453.xyz:8443"
            - name: HOMEPAGE_AUTH_ENABLED
              value: "true"
            - name: HOMEPAGE_EXTERNAL_URL
              value: "https://homepage.646499453.xyz:8443"
            - name: HOMEPAGE_OIDC_ISSUER
              value: "https://authentik.646499453.xyz:8443/application/o/homepage/"
            - name: HOMEPAGE_OIDC_CLIENT_ID
              value: "homepage"
          envFrom:
            - secretRef:
                name: homepage-secrets
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /api/healthcheck
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          volumeMounts:
            - mountPath: /app/config/custom.js
              name: homepage-config
              subPath: custom.js
            - mountPath: /app/config/custom.css
              name: homepage-config
              subPath: custom.css
            - mountPath: /app/config/bookmarks.yaml
              name: homepage-config
              subPath: bookmarks.yaml
            - mountPath: /app/config/docker.yaml
              name: homepage-config
              subPath: docker.yaml
            - mountPath: /app/config/proxmox.yaml
              name: homepage-config
              subPath: proxmox.yaml
            - mountPath: /app/config/kubernetes.yaml
              name: homepage-config
              subPath: kubernetes.yaml
            - mountPath: /app/config/services.yaml
              name: homepage-config
              subPath: services.yaml
            - mountPath: /app/config/settings.yaml
              name: homepage-config
              subPath: settings.yaml
            - mountPath: /app/config/widgets.yaml
              name: homepage-config
              subPath: widgets.yaml
            - mountPath: /app/config/logs
              name: logs
      volumes:
        - name: homepage-config
          configMap:
            name: homepage-config
        - name: logs
          emptyDir: {}
