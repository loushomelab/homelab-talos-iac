apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml
  - rbac.yaml
  - ingressroute.yaml

configMapGenerator:
  - name: homepage-config
    files:
      - settings.yaml
      - bookmarks.yaml
      - services.yaml
      - widgets.yaml
      - kubernetes.yaml
      - docker.yaml
      - proxmox.yaml
      - custom.css
      - custom.js

generatorOptions:
  disableNameSuffixHash: true
