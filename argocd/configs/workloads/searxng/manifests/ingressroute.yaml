apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: searxng
  namespace: n8n
  labels:
    app.kubernetes.io/name: searxng
spec:
  entryPoints:
    - websecure
  routes:
    # Trusted home LAN clients bypass the external Authentik login.
    - match: Host(`searxng.646499453.xyz`) && ClientIP(`192.168.0.0/16`)
      kind: Rule
      priority: 100
      services:
        - name: searxng
          port: 8080
    # All other clients must pass Authentik ForwardAuth.
    - match: Host(`searxng.646499453.xyz`)
      kind: Rule
      priority: 10
      middlewares:
        - name: authentik-forwardauth
          namespace: traefik
      services:
        - name: searxng
          port: 8080
  tls:
    secretName: wildcards-646499453-xyz-tls
