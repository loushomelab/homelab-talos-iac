global:
  env:
    - name: TZ
      value: Asia/Shanghai

crds:
  install: true
  keep: true

configs:
  cm:
    url: https://argocd.646499453.xyz:8443
    accounts.homepage: apiKey
    admin.enabled: "false"
    resource.customizations.ignoreDifferences.argoproj.io_Application: |
      jsonPointers:
      - /metadata/finalizers
    dex.config: |
      connectors:
      - config:
          issuer: https://authentik.646499453.xyz:8443/application/o/argocd/
          clientID: argocd
          clientSecret: $oidc.authentik.clientSecret
          insecureEnableGroups: true
          scopes:
            - openid
            - profile
            - email
            - groups
        name: authentik
        type: oidc
        id: authentik
  params:
    server.insecure: "true"
  secret:
    createSecret: false
  rbac:
    policy.csv: |
      g, authentik Admins, role:admin
      g, homepage, role:readonly
    scopes: '[groups]'

dex:
  enabled: true

redis:
  enabled: true

repoServer:
  env:
    - name: HTTP_PROXY
      value: "http://192.168.50.79:6152"
    - name: HTTPS_PROXY
      value: "http://192.168.50.79:6152"
    - name: http_proxy
      value: "http://192.168.50.79:6152"
    - name: https_proxy
      value: "http://192.168.50.79:6152"
    - name: NO_PROXY
      value: "127.0.0.1,localhost,.svc,.cluster.local,10.96.0.0/12,10.244.0.0/16,192.168.50.0/24"
    - name: no_proxy
      value: "127.0.0.1,localhost,.svc,.cluster.local,10.96.0.0/12,10.244.0.0/16,192.168.50.0/24"

server:
  ingress:
    enabled: true
    ingressClassName: "traefik"
    hostname: argocd.646499453.xyz
    tls: false
    # Provide the exact secret name that holds your wildcard certificate
    extraTls:
      - hosts:
          - argocd.646499453.xyz
        secretName: wildcards-646499453-xyz-tls
    annotations:
      gethomepage.dev/enabled: "true"
      gethomepage.dev/name: "ArgoCD"
      gethomepage.dev/description: "GitOps Continuous Delivery"
      gethomepage.dev/group: "CI/CD"
      gethomepage.dev/icon: "sh-argo-cd.svg"
      gethomepage.dev/href: "https://argocd.646499453.xyz:8443"
      gethomepage.dev/pod-selector: "app.kubernetes.io/name=argocd-server"
      gethomepage.dev/widget.type: "argocd"
      gethomepage.dev/widget.url: "http://argocd-server.argocd.svc.cluster.local:80"
      gethomepage.dev/widget.key: '{{ "{{HOMEPAGE_VAR_ARGOCD_TOKEN}}" }}'
      gethomepage.dev/widget.fields: "[\"apps\", \"synced\", \"outOfSync\", \"healthy\"]"
