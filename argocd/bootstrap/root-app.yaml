apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab-root-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/loushomelab/homelab-talos-iac.git'
    targetRevision: HEAD
    path: argocd/apps 
    directory:
      recurse: true # 重点：开启递归，这样 ArgoCD 就能读取 apps/infrastructure 等子目录
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
